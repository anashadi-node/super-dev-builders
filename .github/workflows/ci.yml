name: ci

# Gerbang otomatis Super Dev Builders.
# Padanan "bukti segar" (aturan #4) sebagai pemeriksaan mesin, bukan disiplin manual.
# Tidak membaca rahasia apa pun: workflow ini hanya menjalankan lint + registry + test + drift.
#
# CATATAN FORMAT:
# 1) Workflow ini dikecualikan dari uji kesetaraan parser fallback (lihat
#    tests/test_scripts.py::test_fallback_yaml_matches_pyyaml_on_repo_files) karena
#    YAML Actions penuh: kunci `on` adalah boolean di YAML 1.1 dan block scalar
#    tidak didukung parser subset. Validitas Actions diverifikasi runner GitHub.
# 2) Nilai scalar TIDAK boleh memuat titik-dua+spasi — ilegal di plain scalar.
#
# CATATAN PORTABILITAS (dari kegagalan CI pertama, jujur):
# Makefile dulu hardcode PY_SYS := /usr/bin/python3 sehingga `make test` di runner
# memakai Python sistem TANPA pytest -> CI merah 17 detik. Kini Makefile memakai
# `PY_SYS ?= $(shell command -v python3)`, jadi ia mengikuti Python aktif di PATH
# (di runner = Python dari setup-python). Jangan kembalikan hardcode itu.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (lint + registry + test + drift)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Pasang dependensi uji (sumber tunggal = pyproject.toml)
        run: python -m pip install --upgrade pip && DEPS=$(python -c "import tomllib,pathlib;print(' '.join(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['dependencies']))") && echo dependensi=$DEPS && python -m pip install $DEPS

      - name: Narasi lingkungan (bukti yang bisa dibaca)
        run: python -V && python -m pytest --version

      # PRASYARAT, bukan hiasan: sebagian uji keamanan menguji kanal media (OCR).
      # Tanpa tesseract, alat menolak lebih awal (fail-closed) dan uji yang mengharapkan
      # pesan spesifik tidak pernah tercapai -> CI merah berhari-hari (30 Okt 2026).
      - name: Pasang alat kanal media (tesseract)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends tesseract-ocr && tesseract --version | head -1

      # Paritas lokal<->CI: cetak berapa berkas yang akan dinilai gerbang higiene,
      # supaya selisih "lokal PASS, CI FAIL" langsung terlihat di log.
      - name: Paritas berkas yang dinilai gerbang
        run: echo "dinilai=$(git ls-files -co --exclude-standard | wc -l)" && git status --porcelain | head -20

      - name: Lint (ruff check scripts tests skills)
        run: make lint

      - name: Lint registry pihak ketiga
        run: make lint-registry

      - name: Test suite
        run: make test

      - name: Drift skill (repo vs terpasang)
        run: if [ -d "$HOME/.hermes/skills" ]; then make drift; else echo SKIP_drift_tanpa_direktori_skill; fi

      - name: Higiene artefak (ukuran, PII, jenis berkas)
        run: make hygiene

      - name: Manifest paket per divisi (hash + lisensi)
        run: make packs
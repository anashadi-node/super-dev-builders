
[project]
name = "sdb-ecosystem"
version = "0.7.2"
requires-python = ">=3.10"
dependencies = [
    "ruff==0.16.10",
    "pytest==9.1.1",
    "pyyaml==6.0.1",
]
[tool.ruff]
# Konfigurasi lint repo Super Dev Builders Ecosystem (dipakai `make lint` = ruff check scripts tests skills dashboard).
# `dashboard/` ikut dilint sejak 2026-10-11 (T11-8): di sanalah layanan web berada — sebelumnya
# gerbang buta terhadap direktori paling sensitif dari sisi keamanan.
line-length = 132
target-version = "py310"

[tool.ruff.lint]
# E/F/I/W = bug paling murah untuk dicegah; RUF = aturan ruff-native.
select = ["E", "F", "I", "W", "RUF"]
ignore = [
    "E501",  # panjang baris: dokumen/skill/embed-string panjang sengaja
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # test melakukan sys.path.insert sebelum import modul repo
"skills/*/tests/*" = ["E402"]

[tool.pytest.ini_options]
# skills/*/tests ikut dijalankan: tes bawaan skill (product-kit, product-status) dulu tidak pernah masuk `make test`
testpaths = ["tests", "skills"]
# -rs: tampilkan ALASAN skip. Uji yang khusus-host (skill terpasang) memang di-skip di
# runner CI; tanpa -rs, skip itu tidak terlihat dan orang bisa mengira semua terperiksa.
# Skip tanpa alasan yang terbaca = lubang bukti. Jangan hapus -rs.
addopts = "-q -rs"
# Dependency dev dipin di [project.dependencies] (ruff/pytest/pyyaml) dan TERKUNCI di
# uv.lock (12 paket, termasuk transitive: colorama, exceptiongroup, iniconfig, packaging,
# pluggy, pygments). Inilah yang membuat `trivy fs` punya sasaran nyata: sebelumnya uv.lock
# hanya metadata sehingga "0 vuln" berarti "belum teruji", bukan "bersih".
# Bila pin berubah: jalankan `uv lock` lagi, lalu `trivy fs --scanners vuln .`
# (kontrol positif ada di docs/archive/AUDIT_20261007_R2.md: canary requests==2.31.0 -> 3 CVE).

name: ci

# Gerbang otomatis Super Dev Builders.
# Padanan "bukti segar" (aturan #4) sebagai pemeriksaan mesin, bukan disiplin manual.
# Tidak membaca rahasia apa pun: workflow ini hanya menjalankan lint + registry + test + drift.
#
# CATATAN FORMAT:
# 1) Workflow ini dikecualikan dari uji kesetaraan parser fallback (lihat
#    tests/test_scripts.py::test_fallback_yaml_matches_pyyaml_on_repo_files) karena
#    YAML Actions penuh: kunci `on` adalah boolean di YAML 1.1 dan block scalar
#    tidak didukung parser subset. Validitas Actions diverifikasi runner GitHub.
# 2) Nilai scalar TIDAK boleh memuat titik-dua+spasi — ilegal di plain scalar.
#
# CATATAN PORTABILITAS (dari kegagalan CI pertama, jujur):
# Makefile dulu hardcode PY_SYS := /usr/bin/python3 sehingga `make test` di runner
# memakai Python sistem TANPA pytest -> CI merah 17 detik. Kini Makefile memakai
# `PY_SYS ?= $(shell command -v python3)`, jadi ia mengikuti Python aktif di PATH
# (di runner = Python dari setup-python). Jangan kembalikan hardcode itu.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (lint + registry + test + drift)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Pasang dependensi uji (sumber tunggal = pyproject.toml)
        run: python -m pip install --upgrade pip && DEPS=$(python -c "import tomllib,pathlib;print(' '.join(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['dependencies']))") && echo dependensi=$DEPS && python -m pip install $DEPS

      - name: Narasi lingkungan (bukti yang bisa dibaca)
        run: python -V && python -m pytest --version

      # GERBANG RAHASIA, fail-closed. `make secrets` TIDAK dipakai di sini: target itu
      # sengaja `exit 0` saat gitleaks tidak terpasang (untuk workstation), sehingga di
      # runner ia akan hijau palsu. Langkah di bawah memasang versi yang dipin, memeriksa
      # checksum rilis resmi, dan GAGAL bila pemasangan atau pemindaian tidak terjadi.
      - name: Pasang gitleaks (pin 8.28.0, sha256 tertanam)
        env:
          GITLEAKS_VERSION: "8.28.0"
          GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "${RUNNER_TEMP}/gitleaks.tgz"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks.tgz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/gitleaks.tgz" -C "${RUNNER_TEMP}" gitleaks
          install -m 0755 "${RUNNER_TEMP}/gitleaks" "${HOME}/.local/bin/gitleaks"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          "${HOME}/.local/bin/gitleaks" version

      - name: Pindai rahasia seluruh riwayat (gagal bila scanner tidak tersedia)
        run: |
          set -euo pipefail
          command -v gitleaks >/dev/null 2>&1 || { echo "FAIL gitleaks tidak tersedia di runner"; exit 1; }
          test "$(gitleaks version)" = "8.28.0" || { echo "FAIL versi gitleaks tidak sesuai pin"; exit 1; }
          mkdir -p reports/ci
          gitleaks detect --config .gitleaks.toml --no-banner --redact \
            --baseline-path .github/gitleaks-baseline.json \
            --log-opts="--all" \
            --report-format json --report-path reports/ci/gitleaks.json
          echo "laporan_rahasia=reports/ci/gitleaks.json (nilai di-redact, baseline 10 temuan teraudit)"

      # PRASYARAT, bukan hiasan: sebagian uji keamanan menguji kanal media (OCR).
      # Tanpa tesseract, alat menolak lebih awal (fail-closed) dan uji yang mengharapkan
      # pesan spesifik tidak pernah tercapai -> CI merah berhari-hari (30 Okt 2026).
      - name: Pasang alat kanal media (tesseract)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends tesseract-ocr && tesseract --version | head -1

      # Paritas lokal<->CI: cetak berapa berkas yang akan dinilai gerbang higiene,
      # supaya selisih "lokal PASS, CI FAIL" langsung terlihat di log.
      - name: Paritas berkas yang dinilai gerbang
        run: echo "dinilai=$(git ls-files -co --exclude-standard | wc -l)" && git status --porcelain | head -20

      - name: Lint (ruff check scripts tests skills)
        run: make lint

      - name: Lint registry pihak ketiga
        run: make lint-registry

      # JUnit ditulis lewat PYTEST_ADDOPTS supaya Makefile (sumber tunggal perintah uji)
      # tidak perlu diubah dan tidak ada eksekusi suite kedua yang membuang waktu runner.
      - name: Test suite
        env:
          PYTEST_ADDOPTS: "--junitxml=reports/ci/junit.xml"
        run: mkdir -p reports/ci && make test

      - name: Drift skill (repo vs terpasang)
        run: if [ -d "$HOME/.hermes/skills" ]; then make drift; else echo SKIP_drift_tanpa_direktori_skill; fi

      # Gerbang dokumen sudah ada sejak lama tetapi TIDAK dipanggil CI — gerbang yang
      # tidak pernah dieksekusi sama saja dengan prosa (audit 2026-11-05, temuan KD3).
      - name: Docs lint (indeks, rujukan path, klaim angka)
        run: make docs-lint

      # Ambang cakupan hanya untuk inti platform (sdb_platform). Diukur 2026-11-05:
      # branch coverage 88%; ambang 85 memberi ruang refactor tanpa membiarkan turun diam-diam.
      - name: Cakupan inti platform tidak boleh turun
        run: |
          python -m pip install "coverage==7.11.0"
          python -m coverage run --branch --source=sdb_platform -m pytest tests -q -o addopts=
          python -m coverage report --include='sdb_platform/*' --fail-under=85

      # Skor benchmark DID dipakai sebagai gerbang, bukan laporan: handoff beku di
      # benchmarks/<target>/handoff.json dibandingkan label independen. Gagal bila
      # ada klaim OBSERVED tanpa bukti atau recall/presisi turun di bawah ambang.
      - name: Suite benchmark DID (halusinasi wajib 0)
        run: make did-suite

      - name: Higiene artefak (ukuran, PII, jenis berkas)
        run: make hygiene

      - name: Manifest paket per divisi (hash + lisensi)
        run: make packs

      # Artefak uji harus bisa diaudit per commit SHA. Isinya HANYA keluaran mesin
      # (JUnit + laporan rahasia yang sudah di-redact + metadata) — tidak ada source
      # privat, token, kredensial, atau data pelanggan.
      - name: Metadata eksekusi (tanpa rahasia)
        if: always()
        env:
          GH_SHA: ${{ github.sha }}
          GH_REF: ${{ github.ref }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_WORKFLOW: ${{ github.workflow }}
        run: |
          set -euo pipefail
          mkdir -p reports/ci
          python - <<'PY'
          import json, os, platform, sys, subprocess, datetime
          meta = {
              "schema": "sdb-ci-evidence/1",
              "repo": os.environ.get("GITHUB_REPOSITORY", "lokal"),
              "git_sha": os.environ.get("GH_SHA") or subprocess.run(["git","rev-parse","HEAD"],capture_output=True,text=True).stdout.strip(),
              "git_ref": os.environ.get("GH_REF", ""),
              "workflow": os.environ.get("GH_WORKFLOW", "lokal"),
              "run_id": os.environ.get("GH_RUN_ID", ""),
              "run_attempt": os.environ.get("GH_RUN_ATTEMPT", ""),
              "runner_os": platform.platform(),
              "python": sys.version.split()[0],
              "pytest": subprocess.run([sys.executable,"-m","pytest","--version"],capture_output=True,text=True).stdout.strip(),
              "sdb_done_policy": os.environ.get("SDB_DONE_POLICY", "attested"),
              "sdb_evidence_mode": os.environ.get("SDB_EVIDENCE_MODE", "legacy"),
              "evidence_level": "CI_ATTESTED",
              "independent_review": False,
              "generated_at": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
          }
          with open("reports/ci/meta.json","w",encoding="utf-8") as fh:
              json.dump(meta, fh, indent=2, sort_keys=True)
              fh.write("\n")
          print(json.dumps(meta, sort_keys=True))
          PY

      - name: Simpan artefak uji per commit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-evidence-${{ github.sha }}
          path: |
            reports/ci/junit.xml
            reports/ci/gitleaks.json
            reports/ci/meta.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

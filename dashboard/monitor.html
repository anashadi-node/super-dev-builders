<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Command Deck — Super Dev Builders</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main">Lompat ke konten</a>
<div class="aura" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#46e6bf" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2.6 20.2 7v10L12 21.4 3.8 17V7z"/><path d="M12 8.2 16 10.4v3.4L12 16l-4-2.2v-3.4z"/>
      </svg>
    </span>
    <span class="brand-txt">
      <strong>Super Dev Builders</strong>
      <small>Command Deck</small>
    </span>
  </div>

  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
    </svg>
    <input id="q" type="search" autocomplete="off" placeholder="Cari skenario, divisi, agen, gate…" aria-label="Cari di Command Deck">
    <kbd>/</kbd>
  </div>

  <div class="meta">
    <span class="live" id="live"><i aria-hidden="true"></i><span id="liveTxt">menghubungkan…</span></span>
    <span class="clock" id="clock">--:--</span>
    <button class="ghost" id="refresh" type="button" aria-label="Muat ulang data" title="Muat ulang data">↻</button>
  </div>
</header>

<nav class="tabs" role="tablist" aria-label="Bagian Command Deck">
  <button class="tab" role="tab" data-view="skenario" aria-selected="true" aria-controls="view">Skenario <span class="n" id="nScen"></span></button>
  <button class="tab" role="tab" data-view="divisi" aria-selected="false" aria-controls="view">Divisi <span class="n" id="nDiv"></span></button>
  <button class="tab" role="tab" data-view="agen" aria-selected="false" aria-controls="view">Agen &amp; Profil <span class="n" id="nAgent"></span></button>
  <button class="tab" role="tab" data-view="alur" aria-selected="false" aria-controls="view">Alur Tahap <span class="n" id="nStage"></span></button>
  <button class="tab" role="tab" data-view="kebijakan" aria-selected="false" aria-controls="view">Kebijakan Rute</button>
</nav>

<main id="main">
  <section class="kpis" id="kpis" aria-label="Ringkasan armada"></section>
  <section id="view" class="view" role="tabpanel" aria-live="polite"></section>
</main>

<div class="drawer-wrap" id="drawer" hidden>
  <div class="scrim" data-close></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <header>
      <div>
        <p class="eyebrow" id="dEyebrow">Skenario</p>
        <h2 id="dTitle">—</h2>
      </div>
      <button class="ghost" type="button" data-close aria-label="Tutup panel">✕</button>
    </header>
    <div class="drawer-body" id="dBody"></div>
  </aside>
</div>

<footer class="foot">
  <span id="footTxt">memuat…</span>
  <span>deck v3 · data langsung dari /api/state</span>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>

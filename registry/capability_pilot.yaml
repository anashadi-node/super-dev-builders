# Capability Registry — PILOT
#
# CATATAN RUANG LINGKUP (jangan salah baca):
#   Berkas ini BUKAN katalog 26 capability dan tidak menggantikan katalog itu.
#   Ia hanya mendaftarkan capability yang sudah punya izin pilot + bukti
#   machine-readable. ID katalog lama tidak ditimpa, tidak dipindah, dan tidak
#   diduplikasi di sini — penambahan entri baru wajib lewat keputusan Owner.
#
# Skema evidence: `sdb.capability.evidence/1` (registry/capability_evidence.schema.json)
# Penulis bukti  : scripts/sdb_capability_evidence.py
# Lokasi bukti   : runs/capability/<capability_id>/<revision-40hex>.json (TIDAK di-commit)
#
# Aturan keras:
#   - `status` hanya PILOT atau ACTIVE; entri tanpa dua nilai itu ditolak pemuat.
#   - `acceptance` tidak pernah berarti "lulus": PASS eksekusi bersifat informatif
#     sampai ada reviewer independen (lihat docs/BE_SP12_EVIDENCE_CONTRACT.md §1).
